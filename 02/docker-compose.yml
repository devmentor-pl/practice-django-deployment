services:
  web:
    build: .
    container_name: web
    command: gunicorn myproject.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    environment:
      - DEBUG=True
    
  nginx:
    image: nginx:alpine
    ports:
    - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - web
