services:
  web:
    build: .
    container_name: web
    command: gunicorn myproject.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - static_data:/app/staticfiles
      - db_data:/app/db
    
  nginx:
    image: nginx:alpine
    ports:
    - "30191:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
    depends_on:
    - web

volumes:
  static_data:
  db_data: